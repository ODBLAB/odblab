[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odblab"
description = "ODBLAB"
keywords = []
version = "0.1.5"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "vtk",
  "PySide6",
  "ansys-dpf-core",
]
authors = [
  { name = "Carlos Souto", email = "csouto@fe.up.pt" },
]

[project.urls]
Documentation = "https://github.com/ODBLAB/odblab/blob/main/README.md"
Issues = "https://github.com/ODBLAB/odblab/issues"
Source = "https://github.com/ODBLAB/odblab"
